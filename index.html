<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPMS | Requisition &amp; Procurement Management System</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="modern.css" />
    <link rel="stylesheet" href="luxury.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#dashboard" aria-label="RPMS home"><img class="brand-logo" src="logo.png" alt="RPMS — Requisition and Procurement Management System" /></a>
        <nav class="main-nav" id="mainNav" aria-label="Main navigation"></nav>
        <div class="sidebar-footer">
          <div class="user-card"><span class="avatar" id="avatar">JM</span><span><strong id="userName">Jordan Martinez</strong><small id="userRole">Requester</small></span></div>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <button class="menu-toggle" id="menuToggle" aria-label="Open navigation">☰</button>
          <div class="page-title"><p id="eyebrow">RPMS WORKSPACE</p><h1 id="pageTitle">My work</h1></div>
          <div class="top-actions">
            <label class="role-switcher">Role <select id="roleSelect" aria-label="View system as role"></select></label>
            <button class="reset-button" id="resetDemoButton" aria-label="Reset demo data" title="Reset demo data">↻</button>
            <button class="icon-button" id="notificationButton" aria-label="Notifications">●<span class="dot"></span></button>
          </div>
        </header>
        <section class="view active" id="dashboard"></section>
        <section class="view" id="queue"></section>
        <section class="view" id="new-request"></section>
        <section class="view" id="requests"></section>
        <section class="view" id="inventory"></section>
        <section class="view" id="stock"></section>
        <section class="view" id="from-purchasing"></section>
        <section class="view" id="reports"></section>
        <section class="view" id="settings"></section>
        <section class="view" id="users"></section>
      </main>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose" aria-label="Close">×</button><span class="label">REQUISITION DETAILS</span><h2 id="modalTitle">Requisition</h2><div id="modalContent"></div></section></div>
    <div class="toast" id="toast" role="status"></div>
    <script src="app.js"></script>
    <script src="procurement-handoff.js"></script>
    <script src="request-units.js"></script>
    <script src="purchase-proof.js"></script>
    <script src="riso-print.js"></script>
    <script src="requester-confirmation.js"></script>
  </body>
</html>
